<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Board</title>
    <link rel="stylesheet" href="../static/style.css">
    <script src="../static/variables.js"></script>
    <script src="../static/database.js"></script>
    <script src="../static/framework/numberFramework.js"></script>
    <script src="../static/visuals.js"></script>
    <script src="../static/hasher.js"></script>
    <script src="../static/api/signup.js"></script>
    <script src="../static/api/login.js"></script>
    <script src="../static/api/loadposts.js"></script>
    <script src="../static/main.js"></script>
    <style> 
    /* General Styles */
body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    margin: 0;
    padding: 0;
}

/* Forum Header */
.forum-header {
    background-color: #1a1a1a;
    color: #d32f2f;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 24px;
}

/* Forum Banner */
.forum-banner {
    width: 100%;
    max-height: 200px;
    background: #2a2a2a;
    text-align: center;
    padding: 20px;
    color: #e0e0e0;
    font-size: 18px;
}

/* Forum Container */
.forum-wrapper {
    width: 80%;
    max-width: 800px;
    margin: 20px auto;
    background: #1e1e1e;
    padding: 20px;
    border-radius: 4px;
    border: 1px solid #444;
}

/* Forum Post Box */
.forum-post-box {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
}

.forum-post-box textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #666;
    background: #252525;
    color: #e0e0e0;
    resize: none;
}

.forum-post-box button {
    margin-top: 10px;
    padding: 10px;
    background-color: #b71c1c;
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.forum-post-box button:hover {
    background-color: #8e1515;
}

/* Forum Posts */
.forum-post-item {
    background: #242424;
    padding: 15px;
    margin-top: 10px;
    border-radius: 4px;
    border: 1px solid #555;
}

.forum-post-meta {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 5px;
}
</style>
</head>
<body>
    <header class="forum-header">
        <h1>Forum Board</h1>
    </header>
    <div class="forum-banner">
        <p>Banner Placeholder - Add your image or text here</p>
    </div>
    <main>
        <section class="forum-wrapper">
            <h2>Discussion Thread</h2>
            <div class="forum-post-box">
            <textarea placeholder="Write a reply..."></textarea>
            <button>Post Reply</button>
            </div>
            <div class="forum-posts" style="background-color: inherit; color: inherit;"></div>
            <div class="forum-post-item">
                <div class="forum-post-meta"><strong>Username</strong> - 2025-04-02 12:34 PM</div>
                <p>This is a sample post.</p>
                <hr>
            </div>
            </div>
        </section>
        <script>
            document.body.style.backgroundColor = "#121212"; // Set the background to black
            document.body.style.color = "#e0e0e0"; // Adjust text color for better contrast
        </script>
    </main>
</body>
</html>
